name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, so HACS and hassfest rule changes show up
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party tools run as official images pinned by digest: their actions
# (hacs/action, home-assistant/actions) pull mutable :main/:latest tags.
# Bump a digest with: docker buildx imagetools inspect <image>:<tag>

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # what HA 2026.11 runs
      - run: python -I -m unittest discover -s tests -v

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ghcr.io/home-assistant/hassfest:latest, 2026-11-08
      - uses: docker://ghcr.io/home-assistant/hassfest@sha256:f9ac52cfe0f7b8770334f191e6713aa9f10f0906a989bd38d75a4933534144c7

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ghcr.io/hacs/action:main, 2026-11-08
      - uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        env:
          INPUT_CATEGORY: integration
          INPUT_IGNORE: brands # no brand icon yet
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ghcr.io/zizmorcore/zizmor:1.32.0
      - uses: docker://ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        with:
          args: --format=github --persona=pedantic .
        env:
          GH_TOKEN: ${{ github.token }}

  gitleaks:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # ghcr.io/gitleaks/gitleaks:v8.30.1
      - uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner -v .
        env:
          # the checkout belongs to the runner user, the container runs as another
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
