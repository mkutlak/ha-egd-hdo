name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, so HACS and hassfest rule changes show up
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party tools run as official images pinned by digest, in plain `run`
# steps: the repo allows only GitHub-owned actions, and hacs/action and
# home-assistant/actions pull mutable :main/:latest images anyway.
# Bump a digest with: docker buildx imagetools inspect <image>:<tag>

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # what HA 2026.11 runs
      - run: python -I -m unittest discover -s tests -v

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hassfest
        env:
          IMAGE: ghcr.io/home-assistant/hassfest@sha256:f9ac52cfe0f7b8770334f191e6713aa9f10f0906a989bd38d75a4933534144c7 # :latest, 2026-11-08
        run: docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro" "$IMAGE"

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # validates the pushed ref through the GitHub API, no checkout needed
      - name: HACS validation
        env:
          IMAGE: ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2 # :main, 2026-11-08
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY_REF: ${{ github.head_ref || github.ref_name }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e REPOSITORY -e REPOSITORY_REF -e INPUT_GITHUB_TOKEN
          -e CATEGORY=integration -e INPUT_IGNORE=brands "$IMAGE"

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          IMAGE: ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d # 1.32.0
          GH_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          "$IMAGE" --format=github --persona=pedantic .

  gitleaks:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        # safe.directory: the checkout belongs to the runner user, the container runs as another
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$IMAGE" git --redact --no-banner -v .
